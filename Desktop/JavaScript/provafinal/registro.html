<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registro</title>
	<link rel="stylesheet" type="text/css" href="estilos.css">
	<style>
/* Main*/
		main{
			background: radial-gradient(ellipse, #FF2D8D 20%, #FF6B35 80%);
			color: #FFFFFF;
			text-align: center;
		}
		main label, input{
			font-size: 1em;
		}
		main form h2{
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 3);
		}
/* Form*/
       main label{
			display: inline-block;
			min-width: 110px;
			padding: 0.5%;
		}

	</style>
</head>
<body>
<header>
	<figure>
		<img src="img/logo.png" alt="Logo PS">
	</figure>
	<h1>Primavera Sound 2027</h1>
	<form>
		<label>Usuario:</label>
			<input type="text" name="usuario" required />
			<br />
			<label>Password:</label>
			<input type="password" name="password" required />
			<br />
			<button type="submit">Log In</button>
	</form>
</header>
<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="novedades.html">Novedades</a></li>
			<li><a href="galeria.html">Galería</a></li>
			<li><a href="registro.html">Registro</a></li>
			<li><a href="contacto.html">Contacto</a></li>
		</ul>
</nav>
<main>
		<form>
			<h2>Formulario de Registro</h2>
			<h4>¡Es gratis, únete!</h4>
			<label>Nombres:</label>
			<input type="text" name="name" required />
			<br />
			<label>Apellidos:</label>
			<input type="text" name="lastname" required />
			<br />
			<label>DNI:</label>
		    <input type="text" name="dni2" pattern="\d{8}[A-HJ-NP-TV-Z]" title="8 números y una letra mayúscula" required/>
			<br />
			<label>Usuario:</label>
			<input type="text" name="usuario" required />
			<br />
			<label>Password:</label>
			<input type="password" name="password" required />
			<br />
            <label>Email:</label>
		    <input type="text" name="mail" pattern="\w{1,}@\w{1,}[.]\w{1,3}" title="ejemplo:mimail@gmail.com" placeholder="Escribe tu Email" required>
			<br />
			<label>Sexo:</label>
			<br />
			<input type="radio" name="sexo" value="H" /><label>Hombre</label>
			<br />
			<input type="radio" name="sexo" value="M" /><label>Mujer</label>
			<br />
			<input type="radio" name="sexo" value="N" /><label>No Binario</label>
			<br />
			<label>Tu estilo de música favorita:</label>
			<br />
			<input type="checkbox" name="pop" value="ok" /><label>Pop</label>
			<br />
			<input type="checkbox" name="heavymetal" value="ok" /><label>Haevy Metal</label>
			<br />
			<input type="checkbox" name="reggaeton" value="ok" /><label>Reggaetón</label>
			<br />
			<input type="checkbox" name="hiphop" value="ok" /><label>Hip-Hop</label>
			<br />
			<input type="checkbox" name="eletro" value="ok" /><label>Electrónica</label>
			<br />
			<label>Fecha de Nacimiento:</label>
		    <input type="text" name="fecha" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" title="00-11-2222" required />
			<br />
			<input type="checkbox" name="acepto" required>
			<label>Acepto formar parte de la web</label>
			<br />
		    <button type="submit">Enviar</button>
		    <button type="reset">Cancelar</button>

		</form>
</main>
<footer>
	<h3>Stay in Touch</h3>
	<h4>Descubre todas las novedades antes que nadie</h4>
	<section>
		<form>
			<label>Email:</label>
			<input type="text" name="mail" pattern="\w{1,}@\w{1,}[.]\w{1,3}" title="ejemplo:mimail@gmail.com" placeholder="Escribe tu Email" required>
			<br />
			<button type="submit">Enviar</button>
			<br />
			<p>*Registrándote estás aceptando la Política de Privacidad.</p>
		</form>
	<figure>
		    <img src="img/logo.png" alt="Logo PS">
	</figure>
	</section>
</footer>
</body>
</html>
